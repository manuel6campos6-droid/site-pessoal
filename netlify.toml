# O site é exportado como HTML estático (`output: "export"` no next.config.ts),
# por isso o Netlify publica a pasta `out/`. Sem `PAGES_BASE_PATH` o site sai
# na raiz do domínio; o prefixo /site-pessoal é só do GitHub Pages.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
